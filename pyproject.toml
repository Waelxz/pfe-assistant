[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pfe-assistant"
version = "0.2.0"
description = "Local-first BYOK assistant for ranking PFE Books, building ATS-ready 1-page CVs tailored per topic, and drafting Gmail-ready applications."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Wael Dridi" }
]
keywords = ["pfe", "pfe-books", "internship", "cv", "resume", "rendercv", "typst", "byok", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "rendercv[full]>=2.6,<3.0",
    "typst>=0.14.0",
    "pymupdf",
    "pyyaml",
    "pydantic>=2.0",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "httpx",
    "beautifulsoup4",
    "lxml",
    "google-genai",
    "python-dotenv",
    "python-multipart",
]

[project.urls]
Homepage = "https://github.com/Waelxz/pfe-assistant"
Repository = "https://github.com/Waelxz/pfe-assistant"
Issues = "https://github.com/Waelxz/pfe-assistant/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
pfe-assistant = "backend.app.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["backend", "backend.app*"]
exclude = ["backend.tests*", "backend.scripts*"]

[tool.setuptools.exclude-package-data]
"backend" = ["tests/*", "scripts/*"]

[tool.setuptools.package-data]
"backend.app" = [
    "llm/prompts/*.md",
    "cv/themes/pfeclassic/*.py",
    "cv/themes/pfeclassic/*.typ",
    "cv/themes/pfeclassic/entries/*.typ",
    "static/**/*",
    "static/*",
]
